[package]
name = "bot-template-rs"
version = "0.1.0"
edition = "2024"


[dependencies]
dashmap = "6.1.0"
serenity = { version = "0.12.5", features = ["voice"] }
poise = "0.6.1"
tokio = { version = "1.51.1", features = [
  "rt-multi-thread",
  "fs",
  "signal",
  "macros",
  "test-util",
  "sync",
] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = { version = "1.0", optional = true }
dotenvy = "0.15"
async-trait = { version = "0.1", optional = true }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }

# Voice / music (optional, gated by `music` and `lavalink` features)
songbird = { version = "0.5", default-features = false, features = [
  "gateway",
  "serenity",
  "native",
], optional = true }
lavalink-rs = { version = "0.15", default-features = false, features = [
  "songbird",
  "serenity",
  "tungstenite-native-tls",
  "macros",
], optional = true }

[dev-dependencies]
mockall = "0.14.0"
tempfile = "3"

[features]
default = ["music", "lavalink"]
# Internal marker: compiles the backend-agnostic music module and trait.
# Users typically enable `music` instead.
music-core = ["dep:async-trait"]
# High-level music commands (/play, /queue, etc.) with the Lavalink backend.
# A future `music-native` feature would add a songbird + yt-dlp + ffmpeg
# backend behind the same MusicBackend trait.
music = ["music-core", "lavalink", "dep:serde_json"]
# Lavalink client plus admin commands (/lavalink show/set/connect).
lavalink = ["dep:lavalink-rs", "dep:songbird"]
# User-owned playlists: save/load/list/feature. Persists to YAML files via
# the PlaylistStore trait; alternative stores (SQLite, etc.) can slot in.
playlists = ["music-core"]
