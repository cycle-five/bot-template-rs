[package]
name = "bot-template-rs"
version = "0.1.0"
edition = "2024"


[dependencies]
dashmap = "6.1.0"
serenity = { version = "0.12.5", features = ["voice"] }
poise = "0.6.1"
tokio = { version = "1.51.1", features = [
  "rt-multi-thread",
  "fs",
  "signal",
  "macros",
  "test-util",
  "sync",
] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = { version = "1.0", optional = true }
dotenvy = "0.15"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = [
  "native-tls",
  "json",
], optional = true }
# Declared directly so we can enable the container/codec features songbird's
# native driver needs to probe yt-dlp's output (WebM/MKV, Ogg, etc.). Cargo
# feature unification forwards these into songbird's own use of symphonia.
symphonia = { version = "0.5", default-features = false, features = [
  "all-formats",
  "all-codecs",
], optional = true }
# Ogg container + zip packaging for the `record` feature.
ogg = { version = "0.9", optional = true }
zip = { version = "2", default-features = false, features = [
  "deflate",
], optional = true }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }

# Voice / music (optional, gated by `music` and `lavalink` features).
#
# songbird 0.6 adds DAVE support, which Discord is making mandatory. We use
# it directly for gateway/driver. lavalink-rs 0.15's `songbird` feature
# pulls songbird 0.5, which would produce a second incompatible version in
# the tree — disable it and construct lavalink `ConnectionInfo` manually in
# `src/lavalink.rs` instead.
songbird = { version = "0.6", default-features = false, features = [
  "gateway",
  "serenity",
  "native",
], optional = true }
lavalink-rs = { version = "0.15", default-features = false, features = [
  "serenity",
  "tungstenite-native-tls",
  "macros",
], optional = true }

[dev-dependencies]
mockall = "0.14.0"
tempfile = "3"

[features]
default = ["music", "lavalink"]

# --- Internal capability flags (not enabled directly) ---
# Base voice wiring (songbird).
voice = ["dep:songbird"]
# Compiles the backend-agnostic music module and MusicBackend trait.
music-core = []

# --- Playback backends ---
# Lavalink client plus admin commands (/lavalink show/set/connect).
lavalink = ["voice", "dep:lavalink-rs"]
# Native in-process playback via songbird's driver. Currently resolves
# tracks through songbird's `YoutubeDl` input, which shells out to `yt-dlp`
# on PATH. A follow-up will add pure-Rust extraction via `rusty_ytdl`, with
# yt-dlp retained as a fallback.
native = [
  "voice",
  "songbird/driver",
  "songbird/builtin-queue",
  "songbird/tungstenite",
  "dep:reqwest",
  "dep:symphonia",
]

# --- User feature bundles ---
# Music commands (/play, /queue, etc.) with the Lavalink backend.
music = ["music-core", "lavalink", "dep:serde_json"]
# Music commands with the native backend.
music-native = ["music-core", "native", "dep:serde_json"]
# User-owned playlists: save/load/list/feature. Persists to YAML files via
# the PlaylistStore trait; alternative stores (SQLite, etc.) can slot in.
playlists = ["music-core"]
# Voice receive capability (only songbird can do this; lavalink never receives).
# Pulls the driver because songbird's event system lives under that feature.
voice-recv = [
  "voice",
  "songbird/driver",
  "songbird/receive",
  "songbird/tungstenite",
]
# Text-to-speech via https://github.com/GnomedDev/tts-service (HTTP microservice
# used by https://github.com/Discord-TTS/Bot). Plays through songbird's native
# driver — coexists with either music backend.
tts = ["native"]
# Per-user Opus-in-Ogg recording, packaged as a zip on /record stop.
# Works alongside either playback backend since receive and playback are
# independent concerns at the songbird layer.
record = ["voice-recv", "dep:ogg", "dep:zip"]
